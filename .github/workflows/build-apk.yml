name: Build APK

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Diagnose server-list stream response
        run: |
          URL="https://frontend.cfx-services.net/api/servers/streamRedir/"
          echo "--- headers ---"
          curl -sS -D - -o /tmp/body.raw -L \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36" \
            -H "Accept: application/json, text/plain, */*" \
            -H "Origin: https://servers.fivem.net" \
            -H "Referer: https://servers.fivem.net/" \
            "$URL" | head -c 4000
          echo
          echo "--- file type ---"
          file /tmp/body.raw
          echo "--- size ---"
          wc -c /tmp/body.raw
          echo "--- first 400 bytes hex+ascii ---"
          xxd /tmp/body.raw | head -n 25
          echo "--- gunzip attempt (first 2000 bytes if it works) ---"
          gunzip -c /tmp/body.raw 2>/tmp/gunzip.err | head -c 2000 || true
          cat /tmp/gunzip.err || true
        continue-on-error: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android platform shell
        run: |
          flutter create --platforms=android --project-name fivem_browser --org de.gio.fivembrowser /tmp/shell
          cp -r /tmp/shell/android ./android

      - name: Ensure INTERNET permission is declared
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            sed -i 's#<manifest xmlns:android="http://schemas.android.com/apk/res/android">#<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <uses-permission android:name="android.permission.INTERNET" />#' "$MANIFEST"
          fi
          grep -n 'uses-permission' "$MANIFEST"

      - name: Install dependencies
        run: flutter pub get

      - name: Generate unique debug-signing keystore
        run: |
          rm -f "$HOME/.android/debug.keystore"
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=FiveM Browser,O=FiveM Browser,C=DE"

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fivem-browser-apk
          path: build/app/outputs/flutter-apk/app-release.apk
