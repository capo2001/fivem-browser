name: Build APK

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android platform shell
        run: |
          flutter create --platforms=android --project-name fivem_browser --org de.gio.fivembrowser /tmp/shell
          cp -r /tmp/shell/android ./android

      - name: Add notification sound resources
        run: |
          mkdir -p android/app/src/main/res/raw
          cp assets/sounds/notif_chime.wav android/app/src/main/res/raw/notif_chime.wav
          cp assets/sounds/notif_bell.wav android/app/src/main/res/raw/notif_bell.wav

      - name: Add app-shortcut icon resource
        run: |
          mkdir -p android/app/src/main/res/drawable
          cp assets/icon/app_icon.png android/app/src/main/res/drawable/ic_shortcut.png

      - name: Ensure required permissions are declared
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            sed -i 's#<manifest xmlns:android="http://schemas.android.com/apk/res/android">#<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <uses-permission android:name="android.permission.INTERNET" />#' "$MANIFEST"
          fi
          if ! grep -q 'android.permission.POST_NOTIFICATIONS' "$MANIFEST"; then
            sed -i 's#<manifest xmlns:android="http://schemas.android.com/apk/res/android">#<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />#' "$MANIFEST"
          fi
          grep -n 'uses-permission' "$MANIFEST"

      - name: Set app display name to Fserver
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's#android:label="[^"]*"#android:label="Fserver"#' "$MANIFEST"
          grep -n 'android:label' "$MANIFEST"

      - name: Install dependencies
        run: flutter pub get

      - name: Enable core library desugaring (required by flutter_local_notifications)
        run: |
          GRADLE=android/app/build.gradle.kts
          if [ ! -f "$GRADLE" ]; then GRADLE=android/app/build.gradle; fi

          if [[ "$GRADLE" == *.kts ]]; then
            perl -0pi -e 's/(compileOptions \{)/$1\n        isCoreLibraryDesugaringEnabled = true/' "$GRADLE"
            printf '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n' >> "$GRADLE"
          else
            perl -0pi -e 's/(compileOptions \{)/$1\n        coreLibraryDesugaringEnabled true/' "$GRADLE"
            printf '\ndependencies {\n    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"\n}\n' >> "$GRADLE"
          fi

          grep -n 'esugar' "$GRADLE"

      - name: Disable release minification (R8 strips WorkManager's reflectively-used classes)
        run: |
          GRADLE=android/app/build.gradle.kts
          if [ ! -f "$GRADLE" ]; then GRADLE=android/app/build.gradle; fi

          if [[ "$GRADLE" == *.kts ]]; then
            if grep -q 'isMinifyEnabled' "$GRADLE"; then
              sed -i 's/isMinifyEnabled\s*=\s*true/isMinifyEnabled = false/' "$GRADLE"
            else
              perl -0pi -e 's/(release \{)/$1\n            isMinifyEnabled = false/' "$GRADLE"
            fi
            if grep -q 'isShrinkResources' "$GRADLE"; then
              sed -i 's/isShrinkResources\s*=\s*true/isShrinkResources = false/' "$GRADLE"
            else
              perl -0pi -e 's/(release \{)/$1\n            isShrinkResources = false/' "$GRADLE"
            fi
          else
            if grep -q 'minifyEnabled' "$GRADLE"; then
              sed -i 's/minifyEnabled\s*true/minifyEnabled false/' "$GRADLE"
            else
              perl -0pi -e 's/(release \{)/$1\n            minifyEnabled false/' "$GRADLE"
            fi
            if grep -q 'shrinkResources' "$GRADLE"; then
              sed -i 's/shrinkResources\s*true/shrinkResources false/' "$GRADLE"
            else
              perl -0pi -e 's/(release \{)/$1\n            shrinkResources false/' "$GRADLE"
            fi
          fi

          grep -n -i 'minify\|shrinkResources' "$GRADLE"

      - name: Add defensive ProGuard keep rules (in case minification is re-enabled)
        run: |
          cat >> android/app/proguard-rules.pro <<'EOF'

          # WorkManager stores its own Room database implementation and instantiates it via
          # reflection; R8 can't see that usage statically and will strip it, crashing the
          # app at startup with "Unable to get provider androidx.startup.InitializationProvider".
          -keep class androidx.work.impl.WorkDatabase_Impl { *; }
          -keep class * extends androidx.work.ListenableWorker {
              <init>(android.content.Context, androidx.work.WorkerParameters);
          }
          -keep class androidx.work.** { *; }
          -dontwarn androidx.work.**

          # flutter_local_notifications (<19) uses Gson reflectively for its payload data class.
          -keepattributes Signature
          -keepattributes *Annotation*
          -dontwarn sun.misc.**
          -keep class * extends com.google.gson.TypeAdapter
          -keep class * implements com.google.gson.TypeAdapterFactory
          -keep class * implements com.google.gson.JsonSerializer
          -keep class * implements com.google.gson.JsonDeserializer
          -keepclassmembers,allowobfuscation class * {
            @com.google.gson.annotations.SerializedName <fields>;
          }
          -keep,allowobfuscation,allowshrinking class com.google.gson.reflect.TypeToken
          -keep,allowobfuscation,allowshrinking class * extends com.google.gson.reflect.TypeToken
          EOF

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Generate unique debug-signing keystore
        run: |
          rm -f "$HOME/.android/debug.keystore"
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=FiveM Browser,O=FiveM Browser,C=DE"

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fivem-browser-apk
          path: build/app/outputs/flutter-apk/app-release.apk
