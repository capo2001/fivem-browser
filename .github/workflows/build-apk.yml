name: Build APK

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android platform shell
        run: |
          flutter create --platforms=android --project-name fivem_browser --org de.gio.fivembrowser /tmp/shell
          cp -r /tmp/shell/android ./android

      - name: Install dependencies
        run: flutter pub get

      - name: Generate unique debug-signing keystore
        run: |
          rm -f "$HOME/.android/debug.keystore"
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=FiveM Browser,O=FiveM Browser,C=DE"

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fivem-browser-apk
          path: build/app/outputs/flutter-apk/app-release.apk
